<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>技カード 50枚の確認</title>
<!-- 開発30（2026-10-14）：正式5体×10技の静止カード（js/battle/move-cards.js）の確認ページ。本編からはつながない・セーブに触れない。
     通常プレイで技管理に出ないノビトン・ジオル・レグナスも含め、種族ごとに10枚を技の一覧と同じ並べ方（2列・16:9）で見る。 -->
<style>
:root{color-scheme:dark}
body{margin:0;padding:12px 16px 40px;background:#120b05;color:#f3e3c0;font-family:"Noto Sans JP",system-ui,sans-serif}
h1{font-size:1.05rem;margin:0 0 4px}p.n{margin:0 0 12px;font-size:.75rem;color:#c9b88f}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button{flex:1;min-width:58px;padding:7px 0;border-radius:999px;background:rgba(0,0,0,.4);color:#e6d6b8;border:1px solid rgba(232,200,106,.5);font-weight:800;font-size:.8rem}
nav button.on{background:linear-gradient(#ffd45a,#c98a1a);color:#3a2000}
h2{font-size:.95rem;margin:16px 0 8px;border-bottom:1px solid rgba(232,200,106,.4);padding-bottom:4px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c{border-radius:12px;padding:5px;border:2px solid #e07a24;background:linear-gradient(#3a2110,#24140a)}
.c img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,226,150,.45)}
.c b{display:block;font-size:.82rem;margin:4px 0 2px;text-align:center}
.c small{display:block;text-align:center;font-size:.6rem;color:#cdbb92;word-break:break-all}
.c.bad{border-color:#f33}
</style></head><body>
<h1>正式5体×10技＝50技カード</h1>
<p class="n">開発用の確認ページ（本編には出ない）。技名・No.・SK の番号は js/phase10/monsters.js から。</p>
<nav id="nav"></nav><div id="out"></div>
<script src="../../js/phase10/monsters.js"></script>
<script>window.MMRULES={NOBI_FIRST:30};</script>
<script src="../../js/battle/move-cards.js"></script>
<script>
const NAME={solamo:'ソラモ',gauru:'ガウル',nobiton:'ノビトン',jiol:'ジオル',flurene:'フルーネ（未解禁・SK なし）',regnas:'レグナス'}; // 2026-10-15：フルーネの10枚も確認できる
const esc=(t)=>String(t).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(sp){
  const sps=sp?[sp]:MMMVCARD.SPECIES;
  document.getElementById('nav').innerHTML=[['','すべて'],...MMMVCARD.SPECIES.map(k=>[k,NAME[k]])].map(([k,l])=>`<button class="${k===(sp||'')?'on':''}" onclick="show('${k}')">${l}</button>`).join('');
  document.getElementById('out').innerHTML=sps.map(k=>{const L=MMMVCARD.list(k);return `<h2 data-sp="${k}">${NAME[k]}（${L.filter(x=>x.src).length} / 10）</h2><div class="g">${L.map(x=>`<div class="c${x.src?'':' bad'}" data-id="${esc(x.id)}"><img src="../../${esc(String(x.src).replace(/^\.\//,''))}" alt="" decoding="async"><b>No.${x.no}　${esc(x.name)}</b><small>${esc(x.id)}・SK ${x.slot==null?'なし（未決）':x.slot}</small></div>`).join('')}</div>`}).join('');
}
show(new URLSearchParams(location.search).get('sp')||'');
</script>
</body></html>
